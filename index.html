<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Review Redirect</title>
    <script type="text/javascript">
        function redirectToReview() {
            const urlParams = new URLSearchParams(window.location.search);
            const reviewSite = urlParams.get('site');  // e.g., "google"
            const businessId = urlParams.get('business');  // e.g., "card1"

            // Mapping review sites to their base URLs
            const reviewSitesMap = {
                "google": "https://search.google.com/local/writereview?placeid=",
                "yelp": "https://www.yelp.com/writeareview/biz/",
                "tripadvisor": "https://www.tripadvisor.com/UserReview-g"
                // Add more mappings as needed
            };

            // Mapping card IDs to their corresponding Place IDs for each review site
            const placeIdMap = {
                "card1": {
                    "google": "ChIJPRQr-ZQhWksRjpC0fT99ml8",
                    "yelp": "yelp-business-id-card1",
                    "tripadvisor": "tripadvisor-business-id-card1"
                },
                "card2": {
                    "google": "ChIJa76xwh5ymkARkk8S5lQtcjY",
                    "yelp": "another-yelp-business-id",
                    "tripadvisor": "another-tripadvisor-business-id"
                }
                // Add more mappings here as needed
            };

            // Validate the parameters and redirect if valid
            if (reviewSitesMap[reviewSite] && placeIdMap[businessId]) {
                const redirectUrl = reviewSitesMap[reviewSite] + placeIdMap[businessId][reviewSite];
                window.location.href = redirectUrl;
            } else {
                document.body.innerHTML = "Invalid parameters. Please check your link.";
            }
        }
    </script>
</head>
<body onload="redirectToReview()">
    <h1>Redirecting...</h1>
</body>
</html>
